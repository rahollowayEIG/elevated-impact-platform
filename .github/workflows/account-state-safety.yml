name: Account state safety checks
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/PlatformApp.jsx'
      - 'src/components/**'
      - 'tests/account-state*'
      - 'package*.json'
      - '.github/workflows/account-state-safety.yml'
permissions:
  contents: read
jobs:
  account-states:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      VITE_SUPABASE_URL: https://state.example.test
      VITE_SUPABASE_ANON_KEY: synthetic-public-key-not-a-live-project
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm install --no-save --package-lock=false playwright@1.63.0
      - run: npx playwright install --with-deps chromium
      - run: node tests/account-states-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: account-state-browser-evidence
          path: test-results/account-states/
          retention-days: 7
          if-no-files-found: ignore
