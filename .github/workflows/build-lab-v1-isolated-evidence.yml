name: Build Lab V1 Isolated Evidence Acceptance
on:
  push:
    branches: [release/build-lab-v1-owner-only-20261028]
    paths:
      - "src/lib/buildLab*.mjs"
      - "tests/build-lab-*.test.mjs"
      - "src/lib/buildChangeImpact.mjs"
      - "src/lib/eigBuildArchitect.mjs"
      - "server/eig-master-*.cjs"
      - "server/eig-master-*.json"
      - "server/eig-essential-wow-scan.cjs"
      - "server/build-lab-source-patterns.cjs"
      - "tests/build-lab-master-source-integration.test.mjs"
      - "tests/build-lab-v1-source-scope.test.cjs"
      - "tests/build-lab-owner-release-readiness.test.cjs"
      - "api/eig-build-lab-live-*.js"
      - "vercel.json"
      - "tests/build-lab-v1-vercel-package.test.cjs"
      - "server/eig-build-lab-live-*.cjs"
      - "server/eig-build-lab-owner-preview-access.cjs"
      - "server/eig-build-lab-durable-records.cjs"
      - "server/eig-build-lab-document-store.cjs"
      - "tests/eig-build-lab-durable-records.test.cjs"
      - "docs/BUILD-LAB-DURABLE-STORAGE-SCHEMA.sql"
      - "tests/build-lab-db-*.sql"
      - "server/eig-build-lab-v1-source-scope.cjs"
      - "src/components/BuildLab*.jsx"
      - "src/components/build-lab-work-buckets.css"
      - "src/lib/eigBuildLab*Client.mjs"
      - "src/lib/eigMasterScanClient.mjs"
      - "src/lib/buildLabCloud*.mjs"
      - "tests/eig-build-lab-live-client.test.mjs"
      - "tests/build-lab-cloud-*.test.mjs"
      - ".github/workflows/build-lab-v1-isolated-evidence.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence-model:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install locked baseline dependencies
        run: npm ci
      - name: Install pinned scanner parser for isolated test only
        run: npm install --no-save --package-lock=false --ignore-scripts @babel/parser@7.29.9
      - name: Evidence export and recovery regression (synthetic/local only)
        run: node --test tests/build-lab-evidence-package.test.mjs tests/build-lab-evidence-recovery.test.mjs tests/build-lab-work-buckets.test.mjs tests/build-lab-manager-blueprint.test.mjs
      - name: Record tested commit
        if: always()
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: echo "Tested isolated release SHA $SOURCE_SHA. No live deployment, database access, or production approval." >> "$GITHUB_STEP_SUMMARY"

  master-scanner-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned test dependencies
        run: |
          npm ci
          npm install --no-save --package-lock=false --ignore-scripts @babel/parser@7.29.9
      - name: Inventory missing release-owned scanner source files
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const {RELEASE_PATHS,validateReleaseSourceScope}=require('./server/eig-build-lab-v1-source-scope.cjs');
          const scope=validateReleaseSourceScope();
          const paths=RELEASE_PATHS;
          if (scope.unscoped.length) throw new Error('Unscoped V1 evidence paths: '+JSON.stringify(scope.unscoped));
          const missing = paths.filter(p => !fs.existsSync(p));
          const summary = process.env.GITHUB_STEP_SUMMARY;
          fs.appendFileSync(summary, '### Release-owned scanner source inventory\n' +
            'Total allowlisted: ' + paths.length + ', missing: ' + missing.length + '\n\n' +
            (missing.length ? missing.map(p => '- Missing: `' + p + '`').join('\n') : 'All allowlisted files present') + '\n');
          if (missing.length) {
            console.error('Strict release package is missing these required source files:\n' + missing.join('\n'));
            process.exitCode = 1;
          }
          NODE
      - name: Mandatory full-source scanner-to-buckets integration
        run: node --test tests/build-lab-master-source-integration.test.mjs
      - name: Record source SHA and block release on any missing files
        if: always()
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: echo "Master Scanner integration exact SHA $SOURCE_SHA. Must pass before release; never mock missing source files." >> "$GITHUB_STEP_SUMMARY"

  pinned-source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned scanner test dependency
        run: |
          npm ci
          npm install --no-save --package-lock=false --ignore-scripts @babel/parser@7.29.9
      - name: Stage exact approved-development source as test-only evidence
        env:
          REFERENCE_SHA: 4cf7bf4ee99ba98aee6f93b199df02a44e2e635d
        run: |
          git fetch origin "$REFERENCE_SHA"
          node -e 'const fs=require("fs");const s=fs.readFileSync("server/eig-master-source-scan.cjs","utf8");const section=s.match(/const FILE_PATHS = Object.freeze\(\[([\s\S]*?)\]\)/);if(!section)process.exit(1);for(const m of section[1].matchAll(/"([^"]+)"/g))console.log(m[1])' > "$RUNNER_TEMP/build-lab-reference-paths.txt"
          while IFS= read -r file; do
            if [ ! -f "$file" ]; then
              mkdir -p "$(dirname "$file")"
              git show "$REFERENCE_SHA:$file" > "$file"
            fi
          done < "$RUNNER_TEMP/build-lab-reference-paths.txt"
      - name: Source-contract test with reference-only files (not release validation)
        run: node --test tests/build-lab-master-source-integration.test.mjs
      - name: Explain strict release gate
        if: always()
        run: echo "Reference-source contract is diagnostic only. master-scanner-integration must pass with release-owned files before deployment approval." >> "$GITHUB_STEP_SUMMARY"

  release-scope-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install isolated scanner parser dependency
        run: |
          npm ci
          npm install --no-save --package-lock=false --ignore-scripts @babel/parser@7.29.9
      - name: Validate V1 source scope and unresolved evidence paths
        run: node --test tests/build-lab-v1-source-scope.test.cjs
      - name: Explain limited scope result
        if: always()
        run: echo "Scope tests do not certify the owner interface or full-source scanner. Strict release integration must pass separately." >> "$GITHUB_STEP_SUMMARY"

  isolated-owner-interface-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install baseline dependencies
        run: npm ci
      - name: Install pinned isolated JSX compiler
        run: npm install --no-save --package-lock=false esbuild@0.28.2
      - name: Compile owner workspace and transitive UI dependencies without routing or deployment
        run: |
          mkdir -p .build-lab-test-output
          ./node_modules/.bin/esbuild src/components/BuildLabLiveOwnerWorkspace.jsx --bundle --platform=browser --format=esm --loader:.css=css --outdir=.build-lab-test-output
      - name: Run existing production base build
        run: npm run build

  owner-client-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned client validation dependency
        run: |
          npm ci
          npm install --no-save --package-lock=false --ignore-scripts @babel/parser@7.29.9
      - name: Verify owner client access failures and cloud recovery contract
        run: node --test tests/eig-build-lab-live-client.test.mjs tests/build-lab-cloud-records.test.mjs tests/build-lab-cloud-backup.test.mjs
      - name: Record scope
        if: always()
        run: echo "Owner browser client and cloud contracts only. This is not live owner authentication or hosted DB approval." >> "$GITHUB_STEP_SUMMARY"

  owner-release-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install locked runtime dependencies for package verification
        run: npm ci --ignore-scripts
      - name: Require reviewed protected owner server routes
        run: node --test tests/build-lab-owner-release-readiness.test.cjs
      - name: Verify disabled cloud records authorization and conflict handling
        run: node --test tests/eig-build-lab-durable-records.test.cjs
      - name: Verify scanner source files will be included in Vercel runtime
        run: node --test tests/build-lab-v1-vercel-package.test.cjs
      - name: Preview owner grant authorization tests
        run: node --test tests/build-lab-owner-preview-access.test.cjs
      - name: Record strict owner-login gate
        if: always()
        run: echo "Passing UI build alone does not permit owner testing. Protected API routes must exist on the same release SHA." >> "$GITHUB_STEP_SUMMARY"

  postgres-schema-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Synthetic, disposable CI database. No production or Sandbox credentials.
    services:
      postgres:
        image: postgres:16.6
        env:
          POSTGRES_PASSWORD: build-lab-ci-only-not-a-real-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGDATABASE: postgres
      PGPASSWORD: build-lab-ci-only-not-a-real-secret
    steps:
      - uses: actions/checkout@v4
      - name: Check isolated database client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          psql --version
      - name: Create synthetic Supabase role and auth fixtures
        run: psql -X -v ON_ERROR_STOP=1 -f tests/build-lab-db-bootstrap.sql
      - name: Apply proposed schema ONLY to disposable PostgreSQL service
        run: psql -X -v ON_ERROR_STOP=1 -f docs/BUILD-LAB-DURABLE-STORAGE-SCHEMA.sql
      - name: Verify RLS, role grants, RPC privileges and version history
        run: psql -X -v ON_ERROR_STOP=1 -f tests/build-lab-db-integration.sql
      - name: Verify two competing saves cannot both win
        shell: bash
        run: |
          set -euo pipefail
          query="SET ROLE service_role; BEGIN; SELECT saved::int FROM public.eig_build_lab_save_document('11111111-1111-4111-8111-111111111111','scan_history',2,'{\"version\":1,\"entries\":[]}'::jsonb); SELECT pg_sleep(0.3); COMMIT;"
          ( psql -XAt -v ON_ERROR_STOP=1 -c "$query" | grep -E '^[01]$' > "$RUNNER_TEMP/claim-a.txt" ) &
          first=$!
          ( psql -XAt -v ON_ERROR_STOP=1 -c "$query" | grep -E '^[01]$' > "$RUNNER_TEMP/claim-b.txt" ) &
          second=$!
          wait "$first"
          wait "$second"
          a="$(cat "$RUNNER_TEMP/claim-a.txt")"
          b="$(cat "$RUNNER_TEMP/claim-b.txt")"
          if [ "$a$b" != "10" ] && [ "$a$b" != "01" ]; then
            echo "Expected one successful save and one revision conflict, got $a / $b"
            exit 1
          fi
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          SET ROLE service_role;
          DO $check$
          DECLARE
            n integer;
            head integer;
          BEGIN
            SELECT count(*), max(revision) INTO n,head
            FROM public.eig_build_lab_document_revisions
            WHERE owner_user_id='11111111-1111-4111-8111-111111111111'
              AND document_key='scan_history';
            IF n<>3 OR head<>3 THEN
              RAISE EXCEPTION 'Concurrent save history not atomic: %, %', n,head;
            END IF;
          END
          $check$;
          SQL
      - name: Record isolation boundary
        if: always()
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: echo "PostgreSQL storage schema checked in isolated CI at $SOURCE_SHA. No live database migration, secret, owner session, or cloud feature enablement." >> "$GITHUB_STEP_SUMMARY"
