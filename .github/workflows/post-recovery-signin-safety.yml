name: Post-recovery sign-in safety
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/auth/**'
      - 'src/App.jsx'
      - 'src/lib/supabase.js'
      - 'tests/post-recovery*'
      - 'package*.json'
      - '.github/workflows/post-recovery-signin-safety.yml'
permissions:
  contents: read
jobs:
  post-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      VITE_SUPABASE_URL: https://recovery.example.test
      VITE_SUPABASE_ANON_KEY: synthetic-public-key-not-a-live-project
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test tests/post-recovery-signin.test.mjs
      - run: npm run build
      - run: npm install --no-save --package-lock=false playwright@1.63.0
      - run: npx playwright install --with-deps chromium
      - run: node tests/post-recovery-signin-browser.mjs
      - run: node tests/recovery-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: post-recovery-signin-evidence
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
