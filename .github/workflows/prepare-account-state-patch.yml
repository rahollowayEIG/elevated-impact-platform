name: Prepare and verify account state patch
on:
  push:
    branches: ['feat/account-state-switches-20261004']
permissions:
  contents: write
jobs:
  prepare:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/account-state-switches-20261004'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      VITE_SUPABASE_URL: https://state.example.test
      VITE_SUPABASE_ANON_KEY: synthetic-public-key-not-a-live-project
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply exact source-hash-guarded integration patch
        run: node scripts/apply-account-state-switches.mjs
      - run: npm ci
      - run: npm run build
      - run: npm install --no-save --package-lock=false playwright@1.63.0
      - run: npx playwright install --with-deps chromium
      - run: node tests/account-states-browser.mjs
      - name: Check password recovery regression suite
        env:
          VITE_SUPABASE_URL: https://recovery.example.test
        run: |
          npm run build
          node tests/recovery-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: state-control-integration-evidence
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
      - name: Commit only the verified integration on this feature branch
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/prepare-account-state-patch.yml scripts/apply-account-state-switches.mjs
          git add src/PlatformApp.jsx package.json docs/ElevationPilot-User-Identity-Rules.md
          git commit -m 'Integrate tested state-first account controls'
          git push origin HEAD:refs/heads/feat/account-state-switches-20261004
