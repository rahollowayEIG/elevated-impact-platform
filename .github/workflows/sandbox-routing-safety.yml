name: Sandbox routing safety
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/PlatformApp.jsx'
      - 'src/main.jsx'
      - 'src/lib/supabase.js'
      - 'src/sandbox/**'
      - 'src/ElevationAirport.jsx'
      - 'tests/sandbox-*.test.mjs'
      - '.github/workflows/sandbox-routing-safety.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  routes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test tests/sandbox-*.test.mjs
      - run: npm run build
