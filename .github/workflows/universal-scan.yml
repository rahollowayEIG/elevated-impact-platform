jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: node --test tests/build-lab-work-buckets.test.mjs tests/build-lab-builder.test.mjs tests/build-lab-inception-pilot.test.mjs tests/build-lab-manager-blueprint.test.mjs tests/build-lab-scan-history.test.mjs tests/research-target-draft.test.mjs tests/eig-build-lab-ai-probe.test.cjs tests/build-change-impact.test.mjs tests/universal-scan.test.mjs tests/openai-scan-preview.test.mjs tests/eig-build-architect.test.mjs tests/eig-build-lab-draft.test.mjs tests/eig-build-lab-scan-client.test.mjs tests/eig-inception-source-scan.test.cjs tests/eig-build-lab-scan-access.test.cjs tests/eig-build-lab-access.test.mjs tests/eig-build-lab-preview-access.test.cjs tests/build-lab-pwa.test.mjs tests/build-lab-mission-orchestrator.test.mjs tests/eig-master-source-scan.test.cjs tests/eig-master-scan-access.test.cjs tests/eig-master-scan-client.test.mjs tests/eig-master-environment-compare.test.cjs tests/event-inquiry-lifecycle.test.mjs tests/event-inquiry-portal-client.test.mjs tests/eig-essential-wow-scan.test.cjs tests/eig-improvement-radar-client.test.mjs
      - run: node --test tests/ep-discovery-engine.test.mjs
      - run: node --test tests/ep-storefront-sources.test.mjs
      - run: node --test tests/ep-unified-store.test.mjs
      - run: node --test tests/ep-invoice-draft.test.mjs
      - run: node --test tests/ep-product-capture.test.mjs
      - run: node --test tests/ep-commerce-contract-readiness.test.mjs
      - run: node --test tests/eig-build-lab-ai-review.test.cjs
      - run: node tests/build-lab-manager-render.cjs
      - run: npx vite build
      - run: npx playwright install --with-deps chromium
      - run: node tests/eig-build-lab-browser.cjs
      - run: node tests/build-lab-work-buckets-browser.cjs
      - run: node tests/inception-apex-browser.cjs
      - run: node tests/event-inquiry-browser.cjs
      - run: node tests/eig-improvement-radar-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eig-build-lab-browser-evidence
          path: |
            test-results/eig-build-lab/
            test-results/inception-apex/
            test-results/event-inquiry/
            test-results/eig-improvement-radar/
          retention-days: 7
          if-no-files-found: ignore

  ia-browser-compatibility:
    name: IA compatibility / ${{ matrix.browser }}
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run IA desktop, tablet and mobile viewport checks
        run: node tests/inception-apex-browser.cjs
        env:
          IA_BROWSER: ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ia-${{ matrix.browser }}-browser-evidence
          path: test-results/inception-apex/${{ matrix.browser }}/
          retention-days: 7
          if-no-files-found: ignore
